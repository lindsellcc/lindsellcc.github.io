name: Refresh Play-Cricket match data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: play-cricket-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh match data
        env:
          PLAY_CRICKET_API_TOKEN: ${{ secrets.PLAY_CRICKET_API_TOKEN }}
        run: python scripts/update_match_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- assets/data/matches.json; then
            echo "No match-data changes."
            exit 0
          fi

          git config user.name "lindsellcc-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add assets/data/matches.json
          git commit -m "Refresh Play-Cricket match data"

          git pull --rebase origin main
          git push origin main
